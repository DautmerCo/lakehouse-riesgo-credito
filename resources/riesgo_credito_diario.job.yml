resources:
  jobs:
    riesgo_credito_diario:
      name: riesgo_credito_diario
      tasks:
        - task_key: bronze
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../notebooks/01_bronze.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: silver
          depends_on:
            - task_key: bronze
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../notebooks/03_silver.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: gold
          depends_on:
            - task_key: silver
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../notebooks/04_gold.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
      email_notifications:
        no_alert_for_skipped_runs: false
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
